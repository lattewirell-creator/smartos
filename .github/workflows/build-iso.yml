name: Build Stupid OS ISO

on:
  workflow_dispatch:
    inputs:
      apps_ref:
        description: "Branch or tag of the Stupid apps to build into the ISO (empty = use their latest GitHub releases)"
        required: false
        default: "main"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The Stupid apps are built from source so the ISO doesn't depend on their Linux releases being out.
  # If one fails, the ISO is still built and that app comes from its latest release instead.
  browser:
    if: github.event_name == 'push' || inputs.apps_ref != ''
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { repository: lattewirell-creator/stupid-browser, ref: "${{ inputs.apps_ref || 'main' }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && node node_modules/electron/install.js && npm run dist:linux
      - uses: actions/upload-artifact@v4
        with: { name: app-browser, path: release/*-linux-amd64.deb, if-no-files-found: error }

  mail:
    if: github.event_name == 'push' || inputs.apps_ref != ''
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { repository: lattewirell-creator/stupid-mail, ref: "${{ inputs.apps_ref || 'main' }}" }
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libdbus-1-dev
          rustup update stable && rustup default stable
          cargo install cargo-deb --locked
          scripts/build-linux.sh
          # A wildcard folder in the upload path would keep that folder in the artifact, out of build.sh's sight
          mkdir -p out && cp release-*/*-linux-amd64.deb out/
      - uses: actions/upload-artifact@v4
        with: { name: app-mail, path: out/*-linux-amd64.deb, if-no-files-found: error }

  buddy:
    if: github.event_name == 'push' || inputs.apps_ref != ''
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { repository: lattewirell-creator/stupid-buddy, ref: "${{ inputs.apps_ref || 'main' }}" }
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev pkg-config imagemagick
          rustup update stable && rustup default stable
          cargo install cargo-deb --locked
          linux/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: app-buddy, path: dist/*-linux-amd64.deb, if-no-files-found: error }

  iso:
    needs: [browser, mail, buddy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h / /mnt

      - name: Collect the app packages
        uses: actions/download-artifact@v4
        with: { pattern: "app-*", path: apps, merge-multiple: true }
        continue-on-error: true

      - name: Build ISO
        run: |
          mkdir -p apps && ls -l apps
          sudo WORK=/mnt/stupidos-work STUPID_APPS_DIR="$PWD/apps" ./build.sh

      - name: Get the ISO ready to publish
        id: iso
        run: |
          cd out
          sudo chown -R "$USER" .
          iso=$(ls StupidOS-*-amd64.iso)
          echo "name=$iso" >> "$GITHUB_OUTPUT"
          # A release file can be at most 2 GiB. Stay one download while it fits; split only if it outgrows that.
          if [ "$(stat -c %s "$iso")" -ge 2147483648 ]; then
            split -b 1900M -d -a 2 "$iso" "$iso.part" && rm "$iso"
            echo "::warning::The ISO is over 2 GiB, so the release carries it in parts"
          fi
          ls -lh

      # Every build becomes the latest release, so this link always gives the newest ISO in one file:
      # https://github.com/lattewirell-creator/smartos/releases/latest/download/StupidOS-1.0-amd64.iso
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Stupid OS ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('(bygge {0})', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/StupidOS-*-amd64.iso*
          body: |
            ## Installera Stupid OS

            1. Ladda ner **${{ steps.iso.outputs.name }}** här nedanför.
            2. Skriv filen till ett USB-minne på minst 8 GB med [balenaEtcher](https://etcher.balena.io): välj filen, välj USB-minnet, klicka på *Flash*.
            3. Starta datorn från USB-minnet. Tryck F12, F11, F2 eller Esc direkt när datorn startar för att få upp startmenyn.
            4. Prova Stupid OS direkt från USB-minnet, och klicka på *Installera Stupid OS* i dockan när du vill installera på riktigt.

            Kontrollsumman (SHA-256) ligger i `.sha256`-filen.
