---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id: live_cleanup
  module: shellprocess
  config: shellprocess_live_cleanup.conf
- id: bootloader_package
  module: shellprocess
  config: shellprocess_bootloader_package.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@live_cleanup
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@bootloader_package
  - umount
- show:
  - finished

branding: stupidos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
